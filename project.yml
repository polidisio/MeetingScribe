name: MeetingScribe
options:
  bundleIdPrefix: com.saraiba
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: DQ7D6387N8
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES

targets:
  MeetingScribe:
    type: application
    platform: macOS
    sources:
      - path: MeetingScribe
        excludes:
          - "*.xcodeproj"
          - "*.xcworkspace"
          - "**/MeetingScribeTests/**"
    settings:
      base:
        PRODUCT_NAME: MeetingScribe
        INFOPLIST_FILE: MeetingScribe/Info.plist
        CODE_SIGN_ENTITLEMENTS: MeetingScribe/MeetingScribe.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.saraiba.meetingscribe
        DEFINES_MODULE: YES
        PRODUCT_MODULE_NAME: MeetingScribe
    entitlements:
      path: MeetingScribe/MeetingScribe.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true

  MeetingScribeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MeetingScribeTests
    dependencies:
      - target: MeetingScribe
    settings:
      base:
        PRODUCT_NAME: MeetingScribeTests
        INFOPLIST_FILE: MeetingScribeTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.saraiba.meetingscribe.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MeetingScribe.app/Contents/MacOS/MeetingScribe"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MeetingScribe:
    build:
      targets:
        MeetingScribe: all
        MeetingScribeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverage: false
      targets:
        - MeetingScribeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release